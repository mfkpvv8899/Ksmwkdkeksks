name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # PASSO DE DIAGNÓSTICO: Vai mostrar exatamente onde o gradlew está
      - name: Encontrar o arquivo gradlew
        run: find . -name "gradlew"

      # Tenta rodar na raiz. Se o projeto estiver na raiz, funciona.
      # Se estiver em subpasta, use o caminho que o passo acima mostrou.
      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar APK de Debug
        run: ./gradlew assembleDebug

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-apk
          # Se o projeto estiver em subpasta, mude para: subpasta/app/build/outputs/apk/debug/*.apk
          path: app/build/outputs/apk/debug/*.apk
