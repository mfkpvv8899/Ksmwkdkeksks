name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Para qualquer daemon antigo que possa estar rodando com ambiente incorreto
      - name: Parar daemons do Gradle
        run: gradle --stop

      # Garante permissão de execução no wrapper (Linux é case-sensitive)
      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x gradlew

      # Usa o wrapper e captura o log completo de erro
      - name: Compilar APK de Debug
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-apk
          path: app/build/outputs/apk/debug/*.apk
