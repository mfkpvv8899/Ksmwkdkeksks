name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Listar arquivos (para diagnóstico)
        run: ls -la

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x gradlew
        working-directory: MinimalLauncher

      - name: Compilar APK de Debug
        run: ./gradlew assembleDebug
        working-directory: MinimalLauncher

      - name: Fazer upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-apk
          path: MinimalLauncher/app/build/outputs/apk/debug/*.apk
