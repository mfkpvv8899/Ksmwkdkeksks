name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extrair projeto do zip
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)" ]; then
            ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
            echo "Extraindo $ZIP"
            unzip -o -q "$ZIP" -d project
          fi

      - name: Aceitar licenças do SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: |
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          echo "Projeto em: $S"
          cd "$(dirname "$S")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-debug
          path: "**/build/outputs/apk/debug/*.apk"
